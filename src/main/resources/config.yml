# BoatsMove
# Core configuration for player-built virtual ships.

ships:
  activation-block: OAK_BUTTON
  max-blocks: 5000
  min-blocks: 2

  # Blocks that cannot belong to a player-built ship.
  forbidden-blocks:
    - STONE
    - IRON_BLOCK
    - BEDROCK
    - END_PORTAL
    - END_PORTAL_FRAME
    - NETHER_PORTAL
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - BARRIER

  allow-activation-in-air: false

movement:
  max-speed: 0.65
  acceleration: 0.035
  reverse-speed: 0.28
  turn-speed: 2.5
  drag: 0.90
  vertical-snap: true
  interpolation-ticks: 2
  water-only: true

cannons:
  material: DISPENSER
  projectile-speed: 2.8
  cooldown-millis: 900
  damage: 18.0
  explosion-radius: 1.25
  max-affected-blocks: 4
  ammo:
    - IRON_NUGGET
    - IRON_INGOT
    - FIRE_CHARGE
    - TNT
    - COBBLESTONE

storage:
  save-on-activation: true
  save-on-deactivation: true
  autosave-seconds: 30

limits:
  max-active-ships: 50
  max-blocks-per-ship: 5000
