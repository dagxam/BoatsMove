# BoatsMove
# Core configuration. Ship activation and full-structure rendering are implemented;
# movement and passenger control are the next layer.

ships:
  activation-block: OAK_BUTTON
  max-blocks: 5000
  min-blocks: 2

  # Blocks that cannot belong to a player-built ship.
  forbidden-blocks:
    - STONE
    - IRON_BLOCK
    - BEDROCK
    - END_PORTAL
    - END_PORTAL_FRAME
    - NETHER_PORTAL
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - BARRIER

  allow-activation-in-air: false

movement:
  max-speed: 0.65
  acceleration: 0.035
  reverse-speed: 0.28
  turn-speed: 2.5
  drag: 0.90
  vertical-snap: true
  interpolation-ticks: 2

storage:
  save-on-activation: true
  save-on-deactivation: true
  autosave-seconds: 30

limits:
  max-active-ships: 50
  max-blocks-per-ship: 5000
